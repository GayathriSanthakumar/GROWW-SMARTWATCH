services:
  postgres:
    image: postgres:16-alpine
    container_name: smartwatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartwatch
      POSTGRES_PASSWORD: smartwatch
      POSTGRES_DB: smartwatch
    ports:
      - "5432:5432"
    volumes:
      - smartwatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smartwatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - smartwatch_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smartwatch_pgdata:
  smartwatch_redis:
